<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Ilustración abstracta de cajas de inventario conectadas por líneas de seguimiento" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowA" cx="18%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#6e6bff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6e6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#3ee6c4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3ee6c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1000" height="500" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
    </pattern>
    <linearGradient id="crateFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#131317"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="#0c0c0f"/>
  <rect width="1000" height="500" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1000" height="500" fill="url(#glowA)"/>
  <rect width="1000" height="500" fill="url(#glowB)"/>

  <!-- Fila de fondo: cajas simples, apagadas -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" fill="url(#crateFace)">
    <rect x="120" y="300" width="120" height="90" rx="4"/>
    <path d="M120 300 L180 268 L300 268 L240 300 Z" fill="#1f1f26" stroke-opacity="0.12"/>
    <path d="M240 300 L300 268 L300 358 L240 390 Z" fill="#101014" stroke-opacity="0.12"/>

    <rect x="700" y="140" width="120" height="90" rx="4"/>
    <path d="M700 140 L760 108 L880 108 L820 140 Z" fill="#1f1f26" stroke-opacity="0.12"/>
    <path d="M820 140 L880 108 L880 198 L820 230 Z" fill="#101014" stroke-opacity="0.12"/>
  </g>

  <!-- Línea de trazabilidad entre lotes -->
  <path d="M300 330 C 420 260, 520 260, 620 200" fill="none" stroke="#6e6bff" stroke-opacity="0.45" stroke-width="1.75" stroke-dasharray="3 7" stroke-linecap="round"/>
  <circle cx="300" cy="330" r="4" fill="#6e6bff" fill-opacity="0.6"/>

  <!-- Caja central destacada (accent) -->
  <g stroke="#6e6bff" stroke-width="2">
    <rect x="560" y="200" width="150" height="112" rx="5" fill="#15142a"/>
    <path d="M560 200 L630 162 L780 162 L710 200 Z" fill="#1b1a38" />
    <path d="M710 200 L780 162 L780 274 L710 312 Z" fill="#100f22"/>
  </g>
  <!-- marca de lote/etiqueta sobre la caja destacada -->
  <circle cx="745" cy="188" r="15" fill="#08080a" stroke="#6e6bff" stroke-width="2"/>
  <path d="M738 188 L744 194 L753 182" fill="none" stroke="#3ee6c4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cajas frontales, línea clara -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.75" fill="url(#crateFace)">
    <rect x="190" y="150" width="130" height="98" rx="5"/>
    <path d="M190 150 L255 115 L385 115 L320 150 Z" fill="#1a1a20"/>
    <path d="M320 150 L385 115 L385 213 L320 248 Z" fill="#101014"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.75" fill="url(#crateFace)">
    <rect x="420" y="330" width="130" height="98" rx="5"/>
    <path d="M420 330 L485 295 L615 295 L550 330 Z" fill="#1a1a20"/>
    <path d="M550 330 L615 295 L615 393 L550 428 Z" fill="#101014"/>
  </g>

  <!-- puntos de "movimiento" flotantes -->
  <circle cx="855" cy="330" r="3" fill="#3ee6c4" fill-opacity="0.5"/>
  <circle cx="885" cy="300" r="2" fill="#3ee6c4" fill-opacity="0.4"/>
  <circle cx="120" cy="230" r="2.5" fill="#6e6bff" fill-opacity="0.4"/>
</svg>
