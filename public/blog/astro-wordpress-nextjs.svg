<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Ilustración abstracta de tres nodos tecnológicos conectados a un punto de decisión central" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowA2" cx="82%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#6e6bff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6e6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB2" cx="10%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#3ee6c4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3ee6c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <mask id="gridMask2">
      <rect width="1000" height="500" fill="url(#fade2)"/>
    </mask>
    <pattern id="grid2" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1000" height="500" fill="#0c0c0f"/>
  <rect width="1000" height="500" fill="url(#grid2)" mask="url(#gridMask2)"/>
  <rect width="1000" height="500" fill="url(#glowA2)"/>
  <rect width="1000" height="500" fill="url(#glowB2)"/>

  <!-- Líneas de conexión hacia el nodo central -->
  <g fill="none" stroke-linecap="round">
    <path d="M500 250 C 420 190, 340 150, 250 130" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M500 250 C 600 170, 680 150, 760 145" stroke="#6e6bff" stroke-opacity="0.5" stroke-width="1.75"/>
    <path d="M500 250 C 460 340, 470 390, 500 430" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>

  <!-- Nodo central: punto de decisión -->
  <g>
    <rect x="470" y="220" width="60" height="60" rx="12" transform="rotate(45 500 250)" fill="#15142a" stroke="#6e6bff" stroke-width="2"/>
    <circle cx="500" cy="250" r="6" fill="#3ee6c4"/>
  </g>

  <!-- Nodo 1: contenido / CMS (líneas apiladas) -->
  <g>
    <circle cx="250" cy="130" r="56" fill="#131317" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
    <rect x="222" y="112" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="222" y="127" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.34"/>
    <rect x="222" y="142" width="34" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.34"/>
  </g>

  <!-- Nodo 2: velocidad / Astro (destacado, rayo) -->
  <g>
    <circle cx="760" cy="145" r="68" fill="#15142a" stroke="#6e6bff" stroke-width="2.25"/>
    <path d="M772 108 L732 156 L758 156 L748 192 L792 138 L764 138 Z" fill="#3ee6c4"/>
  </g>

  <!-- Nodo 3: aplicación / lógica (brackets) -->
  <g>
    <circle cx="500" cy="430" r="52" fill="#131317" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
    <path d="M488 408 L468 430 L488 452" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M512 408 L532 430 L512 452" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- partículas -->
  <circle cx="880" cy="380" r="2.5" fill="#6e6bff" fill-opacity="0.5"/>
  <circle cx="905" cy="410" r="2" fill="#6e6bff" fill-opacity="0.35"/>
  <circle cx="140" cy="330" r="2.5" fill="#3ee6c4" fill-opacity="0.4"/>
</svg>
